name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned secret scanner
        run: python3 scripts/install-gitleaks.py
      - name: Check CAD evidence, print artifacts and tooling
        run: python3 -m unittest discover -s tests -v
      - name: Verify the PLA download bundle
        run: python3 scripts/package-starter.py --check
      - name: Scan source, staged files, history and nested print archives
        run: python3 scripts/check-secrets.py --history
