schema_version: 2
part:
  name: butterfly-habitat
  revision: 0.11.0
  status: engineering-candidate
  body_envelope_mm: [200, 200, 201]
  envelope_note: Exterior clamps, heads, rails and finger grip extend beyond body.
  purpose: Bought-mesh enclosure with washable floor and removable door/roof.
manufacturing:
  process: fdm
  printer: bambu-lab-p1s
  build_volume_mm: [256, 256, 256]
  material: PETG
  nozzle_mm: 0.4
  layer_height_mm: 0.2
  walls: 4
  infill_percent: 20
  brim_mm: 5
  bed: textured-PEI
  support_free_verified: false
  support_required_parts: [front, back, left, right]
  support_type: normal-auto-build-plate-only
  support_angle_deg: 45
cad:
  backend: FreeCAD-Part
  source: src/butterfly-habitat.py
  entry_point: scripts/cad-entry.py
  assembly_manifest: candidate/assembly/manifest.json
  validation_report: candidate/validation.json
  import_writes_files: false
  default_action: check
geometry:
  nominal_min_wall_mm: 1.6
  structural_boss_width_mm: 12
  panel_mm: 8
  clamp_mm: 3
  intersection_tolerance_mm3: 0.001
  collision_exemptions: []
  intended_contact: [head-seats, nut-seats, wall-shoulders, door-bottom-stops, fabric-lands]
  edge_tapers: 0.4 mm entry chamfers on locating tongues and rail entries
  thickness_validation: Critical dimensions and slice features reviewed; intentional edge tapers excluded.
fit:
  required: true
  wall_joints:
    clearance_per_side_mm: 0.25
    parameter: WALL_FIT
    coupon: candidate/coupons/corner-base.stl
  door:
    running_face_clearance_mm: 0.30
    parameter: DOOR_FIT
    closed_overlap_mm: 6
    opening_mm: [152, 158]
    carrier_mm: [164, 170]
    removal_travel_mm: 190
    coupon: candidate/coupons/rail-rail-left.stl
  hardware:
    radial_clearance_mm: 0.30
    parameter: HARDWARE_RADIAL_FIT
    hole_diameter_mm: 3.6
    nut_flat_clearance_per_side_mm: 0.20
    nut_parameter: NUT_FIT
    coupon: candidate/coupons/mesh-fastener-back.stl
  evidence: Physical coupons and 50-cycle test pending.
mesh:
  sheets: 5
  screws_per_ring: 8
  compressed_thickness_mm: 0.20
  thickness_measured: false
  accepted_stack_range_mm: [0.05, 0.40]
  continuous_contact_band_mm: 3
  templates: candidate/templates/
hardware:
  material: stainless-A2
  screws:
    head_type: socket-head-DIN912
    diameter_mm: 3
    pitch_mm: 0.5
    head_diameter_mm: 5.5
    head_height_mm: 3
    driver_mm: 2.5
    quantities:
      - {length_mm: 10, quantity: 45, use: '40 mesh + 4 rails + 1 keeper'}
      - {length_mm: 16, quantity: 6, use: '4 base + 2 roof'}
    source: https://belmetric.com/content/A-PDF_Drawings/BSH3X10SS.pdf
  nuts:
    type: M3-nyloc-DIN985
    supplier_part: NN3SS
    quantity: 51
    across_flats_mm: 5.5
    overall_height_including_nylon_mm: 4
    engagement_mm: 4
    tip_beyond_nut_mm: 1
    source: https://belmetric.com/content/A-PDF_Drawings/NN3SS.pdf
  modeled_as: Conservative hardware envelopes with cleared thread bores.
  tool_access_envelope_mm: {diameter: 5, shaft_length: 40}
print:
  stl_directory: candidate/stl/
  quantity_each: 1
  orientations_already_applied_to_stl: true
  parts:
    - {id: base, file: habitat-base.stl, bed_face: underside}
    - {id: front, file: habitat-front.stl, bed_face: exterior, up: inward-bosses}
    - {id: back, file: habitat-back.stl, bed_face: exterior-mesh-land, up: inward-bosses}
    - {id: left, file: habitat-left.stl, bed_face: exterior-mesh-land}
    - {id: right, file: habitat-right.stl, bed_face: exterior-mesh-land}
    - {id: roof, file: habitat-roof.stl, bed_face: exterior-mesh-land, up: grooves}
    - {id: door, file: habitat-door.stl, bed_face: rear}
    - {id: back-clamp, file: habitat-back-clamp.stl, bed_face: mesh-contact-land}
    - {id: left-clamp, file: habitat-left-clamp.stl, bed_face: mesh-contact-land}
    - {id: right-clamp, file: habitat-right-clamp.stl, bed_face: mesh-contact-land}
    - {id: roof-clamp, file: habitat-roof-clamp.stl, bed_face: mesh-contact-land}
    - {id: door-clamp, file: habitat-door-clamp.stl, bed_face: mesh-contact-land, up: finger-grip}
    - {id: rail-left, file: habitat-rail-left.stl, bed_face: broad-retaining-face}
    - {id: rail-right, file: habitat-rail-right.stl, bed_face: broad-retaining-face}
    - {id: keeper, file: habitat-keeper.stl, bed_face: broad-outer-face}
  excluded: [archive, sketches, experimental-snap-coupons]
service:
  environment: indoor-or-sheltered
  floor: solid-washable
  drainage: none
  camera: none
validation:
  cad_solids: see-generated-report
  stl_manifold_and_components: see-generated-report
  assembly_pairs_and_motion: see-generated-report
  fastener_and_mesh_paths: see-generated-report
  slicing_execution: see-candidate-slicing-results
  slicer_visual_review: passed-with-wall-supports
  whole_part_thickness_review: cut-dimensions-and-slice-features-reviewed
  compressed_mesh_measurement: pending
  physical_fit: pending
  door_50_cycles: pending
  digitally_verified: false
  fit_verified: false
