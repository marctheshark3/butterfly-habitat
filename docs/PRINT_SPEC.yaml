schema_version: 1
part:
  name: butterfly-habitat
  revision: 0.8.0
  product_class: enclosure
  purpose: >
    Observation habitat for the girls. Bought no-see-um or organza is clamped
    between the frame and a second plate, same M3 clearance bolts. Not a
    printed grille. A hatchling is narrower than a 2 mm printed hole. Door
    slide is still a loose lip. Cube edges use an untested PETG snap. Mesh
    screws stay mesh screws. Roof is Plate A: a 200 mm frame, 12 mm
    border, 176 mm window, full clamp ring. No shelf. No cable hole. The roof
    lifts off. That lift is the hatch. The XIAO ESP32-S3 Sense is not cut on
    this plate. Lens center is not recorded. Plate B is a drawing only.
    Screen is a bought sheet, not printed. Photo was style only. Size is the
    ~200 mm cube that fits one P1S bed. MIT license.

manufacturing:
  process: fdm
  printer: bambu-lab-p1s
  build_volume_mm: [256, 256, 256]
  material: PETG
  nozzle_mm: 0.4
  layer_height_mm: 0.2

cad:
  backend: vibecad
  parametric: true
  units: mm
  source_files:
    - src/butterfly-habitat.py

geometry:
  min_wall_mm: 1.6
  min_feature_mm: 1.6
  overlapping_solids_allowed: false
  stl_files:
    - path: stl/habitat-base.stl
      body: base
      expected_shells: 1
    - path: stl/habitat-top.stl
      body: top
      expected_shells: 1
    - path: stl/habitat-back.stl
      body: back-panel
      expected_shells: 1
    - path: stl/habitat-left.stl
      body: left-panel
      expected_shells: 1
    - path: stl/habitat-right.stl
      body: right-panel
      expected_shells: 1
    - path: stl/habitat-front.stl
      body: front-panel
      expected_shells: 1
    - path: stl/habitat-door-frame.stl
      body: door-frame
      expected_shells: 1
    - path: stl/habitat-clamp-wall.stl
      body: clamp-wall
      expected_shells: 1
    - path: stl/habitat-clamp-side.stl
      body: clamp-side
      expected_shells: 1
    - path: stl/habitat-clamp-door.stl
      body: clamp-door
      expected_shells: 1
    - path: stl/habitat-clamp-roof.stl
      body: clamp-roof
      expected_shells: 1
    - path: stl/habitat-snap-tongue-coupon.stl
      body: snap-tongue-coupon
      expected_shells: 1
    - path: stl/habitat-snap-pocket-coupon.stl
      body: snap-pocket-coupon
      expected_shells: 1

